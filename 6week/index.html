<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Cat Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: lightblue;
    }

    .background {
      position: absolute;
      width: 200px;
      height: 200px;
      background: url('cat.png') no-repeat center center;
      background-size: contain;
    }

    .bomb {
      position: absolute;
      width: 200px;
      height: 200px;
      background: url('died.png') no-repeat center center, url('bomb.png') no-repeat center center; /* died.png를 먼저 배치 */
      background-size: contain, contain; /* 두 이미지 크기 조정 */
      animation: grow 0.5s forwards;
    }

    .mouse {
      position: absolute;
      width: 100px;
      height: 100px;
      background: url('mouse.png') no-repeat center center;
      background-size: contain;
      display: none;
    }

    @keyframes grow {
      0% {
        transform: scale(0.5);
      }
      100% {
        transform: scale(2);
      }
    }

    @keyframes disappear {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes fly {
      0% {
        transform: translate(-50%, -100%) rotate(0deg) scale(1);
      }
      25% {
        transform: translate(50px, -50px) rotate(90deg) scale(1.5);
      }
      50% {
        transform: translate(100px, 0) rotate(180deg) scale(2);
      }
      75% {
        transform: translate(50px, 50px) rotate(270deg) scale(1.5);
      }
      100% {
        transform: translate(0, 0) rotate(360deg) scale(1);
      }
    }

    .disappear {
      animation: disappear 0.5s forwards;
    }

    .trembling {
      background: url('trembling.png'), url('cat.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    .caught {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script>
    const catCount = 20;
    const cats = [];
    let isCatCaught = false;
    let targetCat = null;
    const detectionRadius = 300;

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function moveCat(catImage) {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);
      catImage.style.left = `${x}px`;
      catImage.style.top = `${y}px`;
    }

    function getDistance(x1, y1, x2, y2) {
      return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    function selectTargetCat(mouseX, mouseY) {
      const nearbyCats = cats.filter(cat => {
        const catX = cat.offsetLeft + 100;
        const catY = cat.offsetTop + 100;
        return getDistance(catX, catY, mouseX, mouseY) <= detectionRadius;
      });

      if (nearbyCats.length > 0) {
        const randomIndex = Math.floor(Math.random() * nearbyCats.length);
        return nearbyCats[randomIndex];
      }
      return null;
    }

    for (let i = 0; i < catCount; i++) {
      const catImage = document.createElement('div');
      catImage.classList.add('background');
      document.body.appendChild(catImage);
      cats.push(catImage);
      moveCat(catImage);

      catImage.addEventListener('mouseenter', function() {
        if (!catImage.classList.contains('caught') && catImage !== targetCat) {
          moveCat(catImage);
        }
      });

      catImage.addEventListener('click', function() {
        if (!isCatCaught && catImage === targetCat) {
          isCatCaught = true;
          catImage.classList.remove('trembling');
          catImage.classList.add('bomb');
          catImage.classList.add('caught');

          const rect = catImage.getBoundingClientRect();
          const mouseImg = document.createElement('div');
          mouseImg.classList.add('mouse');
          mouseImg.style.top = `${rect.top - 50}px`;
          mouseImg.style.left = `${rect.left}px`;
          document.body.appendChild(mouseImg);
          mouseImg.style.display = 'block';

          mouseImg.style.animation = 'fly 0.5s forwards';

          setTimeout(function() {
            catImage.classList.add('disappear');
            mouseImg.classList.add('disappear');
            setTimeout(function() {
              catImage.remove();
              mouseImg.remove();
              isCatCaught = false;
              targetCat = null;
            }, 500);
          }, 500);
        }
      });
    }

    document.addEventListener('mousemove', function(event) {
      document.body.style.backgroundColor = getRandomColor();

      if (!isCatCaught) {
        targetCat = selectTargetCat(event.clientX, event.clientY);

        if (targetCat) {
          targetCat.classList.add('trembling');
        }

        cats.forEach(cat => {
          if (cat !== targetCat) {
            cat.classList.remove('trembling');
          }
        });
      }
    });
  </script>
</body>
</html>
