<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Cat</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #FFD580; /* 쨍한 주황색으로 변경 */
    }

    .background {
      position: absolute;
      width: 200px;
      height: 200px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      transition: top 0.5s ease, left 0.5s ease;
    }

    .mouse {
      position: absolute;
      width: 300px;
      height: 300px;
      background: url('mouse.png') no-repeat center center;
      background-size: contain;
      display: none;
      z-index: 20;
    }

    .bomb {
      position: absolute;
      width: 150px;
      height: 150px;
      background: url('bomb.png') no-repeat center center;
      background-size: contain;
      z-index: -1;
    }

    @keyframes disappear {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.5);
      }
    }

    .disappear {
      animation: disappear 0.5s forwards;
    }

    @keyframes chargeAtCat {
      0% {
        transform: translate(500px, 0) scale(1);
      }
      100% {
        transform: translate(0, -100px) scale(2); /* 세로 위치를 더 위로 설정 */
      }
    }

    @keyframes shakeCat {
      0% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(10px, 0);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    @keyframes catDie {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }

    .trembling {
      background: url('trembling.png'), url('cat.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      animation: shakeCat 0.3s ease-in-out forwards;
    }

    .caught {
      pointer-events: none;
    }

    .start-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .start-button {
      width: 100%;
      height: 100%;
      background: url('start.png') no-repeat center center;
      background-size: cover;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .timer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      font-weight: bold;
      color: white;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 10px;
    }

    .ending-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('ending.png') no-repeat center center;
      background-size: cover;
      cursor: pointer;
      display: none;
    }

    .fail-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('fail.png') no-repeat center center;
      background-size: cover;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="start-container">
    <button class="start-button"></button>
  </div>

  <div class="ending-screen"></div>
  <div class="fail-screen"></div>

  <script>
    const catCount = 11;
    const cats = [];
    let isCatCaught = false;
    let catsCaughtCount = 0;
    let timerInterval;
    let timeLeft = 15; // 타이머 15초로 변경
    let timerElement;
    let endingScreenElement = document.querySelector('.ending-screen');
    let failScreenElement = document.querySelector('.fail-screen');
    let isGameOver = false;

    function moveCat(catImage) {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);
      catImage.style.left = `${x}px`;
      catImage.style.top = `${y}px`;
    }

    function createCat(catData) {
      const catImage = document.createElement('div');
      catImage.classList.add('background');
      catImage.style.backgroundImage = `url('${catData.image}')`;
      catImage.dataset.reaction = catData.reaction;
      catImage.dataset.death = catData.death;
      document.body.appendChild(catImage);
      return catImage;
    }

    function startCatMovement(catImage) {
      const randomDelay = Math.random() * 2000 + 1000;

      setTimeout(() => {
        if (!catImage.classList.contains('caught')) {
          moveCat(catImage);
          startCatMovement(catImage);
        }
      }, randomDelay);
    }

    const catDetails = [
      { id: 1, image: '1.png', reaction: '1-1.png', death: '1-1-1.png' },
      { id: 2, image: '2.png', reaction: '2-2.png', death: '2-2-2.png' },
      { id: 3, image: '3.png', reaction: '3-3.png', death: '3-3-3.png' },
      { id: 4, image: '4.png', reaction: '4-4.png', death: '4-4-4.png' },
      { id: 5, image: '5.png', reaction: '5-5.png', death: '5-5-5.png' },
      { id: 6, image: '6.png', reaction: '6-6.png', death: '6-6-6.png' },
      { id: 7, image: '7.png', reaction: '7-7.png', death: '7-7-7.png' },
      { id: 8, image: '8.png', reaction: '8-8.png', death: '8-8-8.png' },
      { id: 9, image: '9.png', reaction: '9-9.png', death: '9-9-9.png' },
      { id: 10, image: '10.png', reaction: '10-10.png', death: '10-10-10.png' },
      { id: 11, image: '11.png', reaction: '11-11.png', death: '11-11-11.png' }
    ];

    function startGame() {
      document.querySelector('.start-container').style.display = 'none';

      timerElement = document.createElement('div');
      timerElement.classList.add('timer');
      timerElement.innerText = `Time: ${timeLeft}s`;
      document.body.appendChild(timerElement);

      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.innerText = `Time: ${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (catsCaughtCount < catCount) {
            showFailScreen();
          } else {
            showEndingScreen();
          }
        }
      }, 1000);

      catDetails.forEach(catData => {
        const catImage = createCat(catData);
        cats.push(catImage);
        moveCat(catImage);
        startCatMovement(catImage);

        catImage.addEventListener('mouseenter', function () {
          if (!catImage.classList.contains('caught')) {
            catImage.style.backgroundImage = `url('${catImage.dataset.reaction}')`;
          }
        });

        catImage.addEventListener('mouseleave', function () {
          if (!catImage.classList.contains('caught')) {
            catImage.style.backgroundImage = `url('${catData.image}')`;
          }
        });

        catImage.addEventListener('click', function () {
          if (!isCatCaught) {
            isCatCaught = true;
            catsCaughtCount++;
            catImage.style.backgroundImage = `url('${catImage.dataset.death}')`;
            catImage.classList.add('caught');

            const bomb = document.createElement('div');
            bomb.classList.add('bomb');
            bomb.style.left = `${catImage.offsetLeft + 25}px`;
            bomb.style.top = `${catImage.offsetTop + 25}px`;
            document.body.appendChild(bomb);

            const mouse = document.createElement('div');
            mouse.classList.add('mouse');
            mouse.style.left = `${catImage.offsetLeft + 50}px`;
            mouse.style.top = `${catImage.offsetTop + 50}px`;
            document.body.appendChild(mouse);
            mouse.style.display = 'block';
            mouse.style.animation = 'chargeAtCat 0.25s forwards'; /* 쥐의 속도를 더 빠르게 */

            setTimeout(() => {
              catImage.classList.add('disappear');
              bomb.classList.add('disappear');
              mouse.classList.add('disappear');

              setTimeout(() => {
                catImage.remove();
                bomb.remove();
                mouse.remove();
                isCatCaught = false;
              }, 500);
            }, 500);

            if (catsCaughtCount === catCount) {
              showEndingScreen();
            }
          }
        });
      });
    }

    function showEndingScreen() {
      if (!isGameOver && catsCaughtCount === catCount) {
        isGameOver = true;
        endingScreenElement.style.display = 'block';
        endingScreenElement.addEventListener('click', resetGame);

        timerElement.style.display = 'none';
        setTimeout(() => {
          resetGame();
        }, 3000); // Reset the game after 3 seconds
      }
    }

    function showFailScreen() {
      if (catsCaughtCount < catCount && !isGameOver) {
        failScreenElement.style.display = 'block';
        failScreenElement.addEventListener('click', resetGame);
        timerElement.style.display = 'none';
        cats.forEach(cat => cat.remove());
      }
    }

    function resetGame() {
      failScreenElement.style.display = 'none';
      endingScreenElement.style.display = 'none';
      document.querySelector('.start-container').style.display = 'block';
      document.body.style.backgroundImage = "";
      catsCaughtCount = 0;
      timeLeft = 15; // 타이머 15초로 리셋
      clearInterval(timerInterval);
      cats.length = 0; // 고양이 배열 초기화
      isGameOver = false;
    }

    document.querySelector('.start-button').addEventListener('click', startGame);
  </script>
</body>
</html>
